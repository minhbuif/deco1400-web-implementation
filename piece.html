<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Dashboard | Piece Detail</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-mark">♫</span>
      <span>Piano Dashboard</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Dashboard</a>
      <a href="practice.html">Practice</a>
      <a class="active" href="repertoire.html">Repertoire</a>
      <a href="performance.html">Performance</a>
      <a href="creative.html">Creative</a>
    </nav>
  </header>

  <main>
    <section class="sheet-layout">
      <div class="sheet-viewer">
        <img class="sheet-img" id="sheetImage" src="" alt="Piano sheet music">

        <div class="sheet-pagination">
          <button class="btn secondary" id="prevSheetPageBottom" type="button">Previous Page</button>
          <span id="sheetPageIndicator">Page 1 of 1</span>
          <button class="btn secondary" id="nextSheetPageBottom" type="button">Next Page</button>
        </div>

        <div class="sheet-thumbnails" id="sheetThumbnails"></div>
      </div>

      <aside class="detail">
        <h1 id="pieceTitle">Piece Title</h1>

        <div class="detail-buttons">
          <a class="btn" href="practice.html">▷ Start Practice</a>
          <a
            class="btn red"
            id="viewRecordingButton"
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ View Recording
          </a>
        </div>

        <div class="meta-table">
          <span>Pages</span><span id="piecePages"></span>
          <span>Duration</span><span id="pieceDuration"></span>
          <span>Measures</span><span id="pieceMeasures"></span>
          <span>Key</span><span id="pieceKey"></span>
          <span>Parts</span><span id="pieceParts"></span>
        </div>

        <h2>Notes</h2>
        <textarea class="notes" id="notesArea"></textarea>
        <p class="save-status" id="saveStatus">Autosave is on</p>
      </aside>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
